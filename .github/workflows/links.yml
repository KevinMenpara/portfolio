name: Check links

# Weekly check that every link on the site still works, including the live
# apps. A failed run means a link needs fixing in src/content/profile.ts.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          # Check the built pages; skip LinkedIn (it blocks bots) and email links.
          args: >-
            --no-progress --max-retries 2 --timeout 20
            --root-dir ${{ github.workspace }}/out
            --exclude linkedin.com
            'out/**/*.html'
          fail: true
